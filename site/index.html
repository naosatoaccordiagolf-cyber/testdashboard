<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UENO DAILY</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f3;color:#213330;font:15px/1.65 system-ui,sans-serif}header{background:#173c35;color:white;padding:32px 5vw;display:flex;align-items:end;justify-content:space-between;flex-wrap:wrap;gap:16px}h1{font-size:46px;letter-spacing:-.045em;margin:0}header small{color:#b6d4c7;letter-spacing:.14em}header p{margin:0;color:#d0e4dc}main{max-width:1320px;margin:auto;padding:24px}button,input{font:inherit;padding:7px 12px;border:1px solid #ccd8d4;border-radius:8px;background:white;color:#213330}button{cursor:pointer}button:disabled{opacity:.4}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}.push{margin-right:auto}.primary{background:#286c56;color:white}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px;align-items:start}.card{border:1px solid #dbe4df;border-radius:16px;background:white;padding:20px;min-width:0}.head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.head h2{font-size:20px;margin:0 auto 0 0}.head button{padding:2px 8px}.meta,.foot{font-size:12px;color:#667c74;margin:8px 0 16px}.warning{color:#925516;background:#fff7e9;padding:8px;border-radius:8px}.big{font-size:42px;font-weight:700}.hourly{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.hour{text-align:center;background:#f1f6f3;padding:7px 1px;border-radius:8px;font-size:12px}.hour b{display:block;font-size:16px}.item{border-top:1px solid #e8eeeb;padding:12px 0}.item a{font-weight:650;color:#174e3e;text-decoration:none;overflow-wrap:anywhere}.item small{display:block;color:#6a7d76}.scroll{max-height:390px;overflow:auto}.filter{width:100%;margin-bottom:10px}a{color:#286c56}dialog{border:1px solid #ccd8d4;border-radius:16px;max-width:90vw;padding:24px}dialog::backdrop{background:#163a3566}#choices{display:grid;gap:8px}</style></head><body><header><div><small>LOCAL INTELLIGENCE / TOKYO</small><h1>UENO DAILY.</h1><p>上野・御徒町の毎日を、ひとつの画面で。</p></div><div id="date"></div></header><main><div class="toolbar"><span class="push">毎朝 07:00 JST 更新予定</span><span id="status">確認中</span><button id="refresh">↻ 最新データ表示</button><button id="add" class="primary">＋ カード追加</button></div><div id="grid"></div><p class="foot">天気：<a href="https://open-meteo.com/">Open-Meteo</a> ／ 店舗：© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> ／ ニュース：<a href="https://news.google.com/">Google News</a>。営業時間・営業状況は保証されない。ニュースはRSS掲載順。</p></main><dialog id="modal"><h2>カード追加</h2><div id="choices"></div><p><button id="close">閉じる</button></p></dialog><script>
const catalog={weather:'本日の天気',food:'上野・御徒町の飲食店',news:'注目ニュース',local:'地域ニュース',cafe:'カフェ・軽食',links:'便利なリンク'};let layout;try{layout=JSON.parse(localStorage.getItem('ueno-layout'));if(!Array.isArray(layout))throw 0;layout=[...new Set(layout.filter(k=>Object.hasOwn(catalog,k)))]}catch{layout=['weather','food','news','local']}let data={},search={};const $=id=>document.getElementById(id);const E=(tag,txt,cls)=>{let x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x};function link(txt,url){let a=E('a',txt);try{let u=new URL(url);if(u.protocol==='https:')a.href=u.href}catch{}a.target='_blank';a.rel='noopener noreferrer';return a}function dt(s){if(!s)return '未取得';let d=new Date(s);return isNaN(d)?s:d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})}function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function weatherName(c){return c===0?'晴れ':c<=2?'晴れ時々曇り':c===3?'曇り':c<=48?'霧':c<=57?'霧雨':c<=67?'雨':c<=77?'雪':c<=82?'にわか雨':c<=86?'雪':'雷雨'}function save(){localStorage.setItem('ueno-layout',JSON.stringify(layout));render()}function btn(t,fn,disabled=false){let b=E('button',t);b.onclick=fn;b.disabled=disabled;return b}function swap(i,j){[layout[i],layout[j]]=[layout[j],layout[i]];save()}
function render(){let g=$('grid');g.replaceChildren();$('date').textContent=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'full'}).format(new Date());$('status').textContent='更新試行：'+dt(data.last_attempt);for(let [i,k] of layout.entries()){let c=E('section',undefined,'card'),h=E('div',undefined,'head');h.append(E('h2',catalog[k]),btn('←',()=>swap(i,i-1),i===0),btn('→',()=>swap(i,i+1),i===layout.length-1),btn('×',()=>{layout.splice(i,1);save()}));c.append(h);let record=data[k==='cafe'?'food':k]||{};if(k==='links'){for(let [t,u] of [['台東区公式サイト','https://www.city.taito.lg.jp/'],['気象庁','https://www.jma.go.jp/'],['上野駅周辺地図','https://www.openstreetmap.org/#map=15/35.7105/139.7746']]){let p=E('p');p.append(link(t,u));c.append(p)}g.append(c);continue}c.append(E('div','取得：'+dt(record.updated),'meta'));if(record.error)c.append(E('p','取得失敗。前回取得データがある場合は表示中。','warning'));if(!record.data){c.append(E('p','データ未取得。次回の更新後に確認してください。','meta'));g.append(c);continue}let d=record.data;if(k==='weather'){let ix=d.daily.time.indexOf(today());if(ix<0){c.append(E('p','本日の予報は未取得。','warning'));g.append(c);continue}c.append(E('div',weatherName(d.daily.weather_code[ix])),E('div',d.daily.temperature_2m_max[ix]+'° / '+d.daily.temperature_2m_min[ix]+'°','big'),E('div','最大降水確率 '+d.daily.precipitation_probability_max[ix]+'%'));let hours=E('div',undefined,'hourly');for(let hour of [6,9,12,15,18,21]){let j=d.hourly.time.indexOf(today()+'T'+String(hour).padStart(2,'0')+':00');if(j<0)continue;let box=E('div',undefined,'hour');box.append(E('span',hour+':00'),E('b',d.hourly.temperature_2m[j]+'°'),E('span',d.hourly.precipitation_probability[j]+'%'));hours.append(box)}c.append(hours)}else if(k==='food'||k==='cafe'){let input=E('input');input.className='filter';input.placeholder='店名・料理ジャンルで絞り込み';input.value=search[k]||'';let results=E('div',undefined,'scroll');let items=k==='cafe'?d.filter(x=>['cafe','fast_food'].includes(x.category)):d;function list(){results.replaceChildren();let q=input.value.toLowerCase();let filtered=items.filter(x=>(x.name+' '+x.cuisine+' '+x.category).toLowerCase().includes(q));results.append(E('div',filtered.length+' 件（地図登録情報）','meta'));for(let x of filtered.slice(0,100)){let r=E('div',undefined,'item');r.append(link(x.name,x.url),E('small',(x.cuisine||x.category)+' ｜ '+(x.hours||'営業時間未登録')));results.append(r)}}input.oninput=()=>{search[k]=input.value;list()};c.append(input,results);list()}else{let results=E('div',undefined,'scroll');for(let x of d){let r=E('div',undefined,'item');r.append(link(x.title,x.url),E('small',x.source+' ｜ '+dt(x.published)));results.append(r)}c.append(results)}g.append(c)}}
$('add').onclick=()=>{let p=$('choices');p.replaceChildren();for(let k in catalog)p.append(btn(catalog[k],()=>{layout.push(k);save();$('modal').close()},layout.includes(k)));$('modal').showModal()};$('close').onclick=()=>$('modal').close();async function load(){try{let r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw Error();let n=await r.json();if(JSON.stringify(n)!==JSON.stringify(data)){data=n;render()}else $('status').textContent='更新試行：'+dt(data.last_attempt)}catch{$('status').textContent='公開データ未取得'}}$('refresh').onclick=load;render();load();setInterval(load,60000);
</script></body></html>
